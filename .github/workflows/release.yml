name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  homebrew:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Publish the formula to olimorris/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::The HOMEBREW_TAP_TOKEN secret isn't set, so Foreman $VERSION wasn't published to olimorris/homebrew-tap. Add a token that can push to that repo, then rerun this job."
            exit 0
          fi
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$TAG.tar.gz" -o foreman.tar.gz
          sha=$(sha256sum foreman.tar.gz | cut -d' ' -f1)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/olimorris/homebrew-tap.git" tap
          mkdir -p tap/Formula
          packaging/homebrew/render.sh "$VERSION" "$sha" > tap/Formula/foreman.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/foreman.rb
          if git diff --cached --quiet; then
            echo "The tap already has Foreman $VERSION."
          else
            git commit -m "foreman $VERSION"
            git push
          fi
