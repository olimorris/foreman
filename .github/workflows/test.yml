name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux runners use a tenth of the Actions minutes that macOS ones do, and the tests don't need macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
