name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Foreman is macOS-only, and its tests rely on macOS paths and tools.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
